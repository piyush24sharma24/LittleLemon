{% extends 'base.html' %}
{% load static %}
{% block content %}
<section>
    <article>
        <h1>Menu item</h1>
        <span>
            <a href="{% url 'home' %}">Home</a> /
            <a href="{% url 'menu' %}">Menu</a>/
            <!-- Step: Replace code here -->
            {{menu_item.name}}
        </span>
        <!--Begin row-->
        <div class="row">
            <!--Begin col-->
            <div class="column">
                <h2>
                    <!-- Step: Replace code here -->
                    {{menu_item.name}}
                </h2>
                <p>
                    <!-- Step: Replace code here -->
                    {{menu_item.description}}
                </p>
                <p>
                    <!-- Step: Replace code here -->
                    ${{menu_item.price}}.00
                </p>
            </div>
            <!--End col-->
            <!--Begin col-->
            <div class="column">
                {% if menu_item.image  %}
                <img src="{{ menu_item.image.url }}" alt="{{ menu_item.name }}" width="300" />
                {% else %}
                <p>
                    no image to show
                </p>
                {% endif %}
            </div>
            <!--End col-->
        </div>
        <!--End row-->
    </article>
</section>
{% endblock %}
